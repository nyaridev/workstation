# Release: on a version tag, builds the signed installers and the updater's latest.json into a draft GitHub release
# (ADR-0014, ADR-0016). Push a tag like v0.2.0 to run it; publish the draft for the app's updater to see it. Needs the
# TAURI_SIGNING_PRIVATE_KEY secret (TAURI_SIGNING_PRIVATE_KEY_PASSWORD only for a key with a password; this one has
# none).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - os: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev patchelf file pkg-config
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # A release without the updater's public key would ship updates nobody can check.
      - name: Updater key is set
        shell: bash
        run: node -e "if (!require('./src-tauri/tauri.conf.json').plugins.updater.pubkey) { console.error('Set plugins.updater.pubkey in src-tauri/tauri.conf.json (ADR-0014).'); process.exit(1) }"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Workstation ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.updater.conf.json
