<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Workstation</title>
  <!-- Workstation: a dark tile holding a 2×2 grid of project folders, one lit (the open workstation). -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#18181b"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#3f3f46" stroke-width="8"/>
  <g fill="#3f3f46">
    <rect x="104" y="104" width="136" height="136" rx="28"/>
    <rect x="272" y="272" width="136" height="136" rx="28"/>
    <rect x="104" y="272" width="136" height="136" rx="28"/>
  </g>
  <rect x="272" y="104" width="136" height="136" rx="28" fill="#e4e4e7"/>
  <circle cx="340" cy="172" r="22" fill="#18181b"/>
</svg>
